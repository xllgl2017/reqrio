name: github
#git commit -m "修复bug [skip actions]"
#git commit -m "更新功能 [skip ci]"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-check:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: x86_64-linux-gnu
            outdir: debug
            file: libreqrio.so
          - os: windows-latest
            artifact: x86_64-windows-msvc
            outdir: debug
            file: reqrio.dll
#          - os: windows-2022
#            artifact: go-windows-gnu
#            outdir: x86_64-pc-windows-gnu/debug
#            file: reqrio.dll
          - os: macos-latest
            artifact: macos-aarch64
            outdir: debug
            file: libreqrio.dylib
    runs-on: ${{ matrix.os }}
    env:
      REQRIO_TOKEN: ${{ secrets.REQRIO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: |
            ${{ runner.os }}-cargo-
          cache-on-failure: true
      - name: build and test
        run: |
          cargo test --features aync,serde,staticlink,quic,reqtls/cert_signer
          cargo build --package reqrio --features export,staticlink,quic,reqtls/cert_signer
      - name: Copy dylib to bindings
        run: cp target/${{ matrix.outdir }}/${{ matrix.file }} bindings/python/reqrio/
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Set python path env
        shell: bash
        run: echo "PYTHONPATH=${{ github.workspace }}/bindings/python" >> "$GITHUB_ENV"
      - name: Run Python FFI Test
        run: |
          python bindings/python/tests/test_session.py
          python bindings/python/tests/test_cipher.py

