  #    steps:
  #      - uses: actions/checkout@v4
  #        with:
  #          submodules: recursive
  #      - uses: Swatinem/rust-cache@v2
  #        with:
  #          key: |
  #            ${{ runner.os }}-cargo-${{ github.ref }}-${{ hashFiles('**/Cargo.lock') }}
  #            ${{ runner.os }}-cargo-${{ github.ref }}-
  #            ${{ runner.os }}-cargo-
  #          cache-on-failure: true
  #          prefix-key: |
  #            ${{ runner.os }}-cargo-
  #
  #      - name: cargo test
  #        run: |
  #          cargo test --features aync,serde --release
  #
  #      - name: cargo build (export cdylib)
  #        run: cargo build --package reqrio --release --features export
  #
  #      - name: Copy native lib (Linux)
  #        if: runner.os == 'Linux'
  #        run: cp target/release/libreqrio.so bindings/python/reqrio/
  #
  #      - name: Copy native lib (Windows)
  #        if: runner.os == 'Windows'
  #        run: copy target\release\reqrio.dll bindings\python\reqrio\
  #
  #      - name: Set PYTHONPATH (Linux)
  #        if: runner.os == 'Linux'
  #        run: echo "PYTHONPATH=${{ github.workspace }}/bindings/python" >> $GITHUB_ENV
  #
  #      - name: Set PYTHONPATH (Windows)
  #        if: runner.os == 'Windows'
  #        run: echo "PYTHONPATH=${{ github.workspace }}\bindings\python" >> $env:GITHUB_ENV
  #
  #      - name: Run Python FFI test
  #        run: |
  #          python bindings/python/tests/test_session.py
  #          python bindings/python/tests/test_cipher.py

  # ----------------------------------------------------------------------------
  # 版本号 bump：改好所有文件版本号后提交到「临时分支」ci/release-<version>，
  # 不直接推主分支；下游全部基于该临时分支构建/发布，
  # 待所有任务成功后由 finalize 合并回主分支并打 tag
  # ----------------------------------------------------------------------------
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]*)?$'; then
            echo "非法版本号: ${{ inputs.version }}" >&2
            exit 1
          fi

      - name: Bump version in all packages
        env:
          NEW: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Rust: reqrio / reqtls 包版本（行首 version）
          sed -i -E 's/^version = "[^"]*"/version = "'"$NEW"'"/' reqrio/Cargo.toml
          sed -i -E 's/^version = "[^"]*"/version = "'"$NEW"'"/' reqtls/Cargo.toml

          # Rust: 工作区对 reqtls 的依赖引用
          sed -i -E 's/(reqtls = \{ path = "reqtls", version = ")[^"]*(")/\1='"$NEW"'\2/' Cargo.toml

      - name: Commit to temp release branch
        env:
          NEW: ${{ inputs.version }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reqrio/Cargo.toml reqtls/Cargo.toml Cargo.toml bindings
          # 版本号已是目标值时无改动可提交，跳过 commit 但仍推临时分支
          if git diff --cached --quiet; then
            echo "版本号已是 ${NEW}，无需提交"
          else
            git commit -m "bump version ${NEW}"
            # 推到临时分支（不碰主分支）；-f 让本版本号可重跑覆盖
            git push -f origin "${{ github.ref_name }}"
          fi
  # ----------------------------------------------------------------------------
  # 构建跨平台原生库，上传为 artifact 供各语言发布任务复用：
  #   native-linux    : linux  libreqrio.so
  #   native-windows  : windows-msvc reqrio.dll（+ .lib）
  #   go-windows-gnu  : windows-gnu  reqrio.dll（供 go 使用，故单独命名避免与 msvc 冲突）
  # ----------------------------------------------------------------------------
  build-natives:
    name: build-natives (${{ matrix.target.artifact }})
    needs: bump-version
    strategy:
      matrix:
        target:
          - { os: ubuntu-latest,  artifact: native-linux,   rust_target: "",                    outdir: release,                       file: libreqrio.so }
          - { os: windows-latest, artifact: native-windows, rust_target: "",                    outdir: release,                       file: reqrio.dll }
          - { os: windows-2022,   artifact: go-windows-gnu, rust_target: x86_64-pc-windows-gnu, outdir: x86_64-pc-windows-gnu/release, file: reqrio.dll }
          - { os: macos-latest,   artifact: native-macos,   rust_target: "",                    outdir: release,                       file: libreqrio.dylib }
    runs-on: ${{ matrix.target.os }}
    env:
      REQRIO_TOKEN: ${{ secrets.REQRIO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: main
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: |
            ${{ runner.os }}-cargo-

      # 预编译静态库（lib/windows/gnu）是用 MSYS2 mingw64 编的，
      # runner 自带的 C:\mingw64 链接会缺 codecvt<wchar_t> 符号，
      # 故装与本地一致的 MSYS2 mingw64 并放到 PATH 最前
      - name: Setup MSYS2 mingw64 toolchain (windows-gnu)
        if: matrix.target.rust_target == 'x86_64-pc-windows-gnu'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Prepend MSYS2 mingw64 to PATH (windows-gnu)
        if: matrix.target.rust_target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: echo "${RUNNER_TEMP}/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: cargo build (export cdylib)
        shell: bash
        run: |
          if [ -n "${{ matrix.target.rust_target }}" ]; then
            # windows-gnu: bds.cpp 的 std::filesystem / codecvt 符号只在静态
            # libstdc++.a 里、DLL 不导出，追加静态 stdc++（排在最后解析残留引用）
            export RUSTFLAGS="-Clink-arg=-Wl,-Bstatic -Clink-arg=-lstdc++ -Clink-arg=-Wl,-Bdynamic"
            cargo build --package reqrio --release --features export,staticlink,quic --target "${{ matrix.target.rust_target }}"
          else
            cargo build --package reqrio --release --features export,staticlink,quic
          fi

      - name: Upload native lib
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: |
            target/${{ matrix.target.outdir }}/${{ matrix.target.file }}
            target/${{ matrix.target.outdir }}/*.lib
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # GitHub Release：聚合原生库并创建 Release
  # ----------------------------------------------------------------------------
  github-release:
    name: github-release
    needs: build-natives
    runs-on: ubuntu-latest
    # 预发行版本（alpha/beta/rc）不创建 GitHub Release，仅发布到各语言仓库
    if: >-
      !contains(inputs.version, 'alpha')
      && !contains(inputs.version, 'beta')
      && !contains(inputs.version, 'rc')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: main
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{inputs.version}}"
          awk -v ver="reqrio-v${VERSION}" '
            $0 == "# " ver { capture = 1; next }
            capture && /^# reqrio-v/ { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.txt
          if [ ! -s RELEASE_NOTES.txt ]; then
            echo "未在 CHANGELOG.md 中找到版本 ${VERSION} 的说明" >&2
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Download native libs
        if: steps.check-notes.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true

      - name: Place native libs into packages
        if: steps.check-notes.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p natives || true
          if [ -f natives/libreqrio.so ]; then
            cp natives/libreqrio.so bindings/python/reqrio/ 
            cp natives/libreqrio.so bindings/java/src/main/resources/ 
            cp natives/libreqrio.so bindings/nodejs/ 
            cp natives/libreqrio.so bindings/qt/ 
            cp natives/libreqrio.so bindings/go/ 
          fi
          if [ -f natives/reqrio.dll ]; then
            cp natives/reqrio.dll bindings/python/reqrio/ 
            cp natives/reqrio.dll bindings/java/src/main/resources/ 
            cp natives/reqrio.dll bindings/nodejs/ 
            cp natives/reqrio.dll bindings/qt/ 
            cp natives/reqrio.dll bindings/go/ 
          fi
          if [ -f natives/libreqrio.dylib ]; then
            cp natives/libreqrio.dylib bindings/python/reqrio/ 
            cp natives/libreqrio.dylib bindings/java/src/main/resources/ 
            cp natives/libreqrio.dylib bindings/nodejs/ 
            cp natives/libreqrio.dylib bindings/qt/ 
            cp natives/libreqrio.dylib bindings/go/ 
          fi
          if ls natives/*.lib 1> /dev/null 2>&1; then
            cp natives/reqrio.dll.lib bindings/qt/reqrio.lib
          fi

      - name: Package bindings into zips
        if: steps.check-notes.outputs.skip != 'true'
        run: |
          mkdir -p dist
          zip -r dist/py.zip   bindings/python
          zip -r dist/go.zip   bindings/go
          zip -r dist/js.zip   bindings/nodejs
          zip -r dist/java.zip bindings/java
          zip -r dist/qt.zip   bindings/qt

      - name: Determine version and create tag if not pre-release
        if: steps.check-notes.outputs.skip != 'true'
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Create GitHub Release
        if: steps.check-notes.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body_path: RELEASE_NOTES.txt
          files: |
            dist/py.zip
            dist/go.zip
            dist/js.zip
            dist/java.zip
            dist/qt.zip

  # ----------------------------------------------------------------------------
  # Rust → crates.io
  # ----------------------------------------------------------------------------
  publish-crate:
    name: publish-crate (crates.io)
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: main
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --package reqtls || true
          cargo publish --package reqrio || true


  # ----------------------------------------------------------------------------
  # 收尾：所有任务成功后，下载 go 所需原生库放入 reqrio-go 并提交，
  # 把版本提交合并回主分支、推送 go module tag，最后清理临时分支
  # ----------------------------------------------------------------------------
  finalize:
    name: finalize
    needs:
      - build-natives
      - github-release
      - publish-crate
    # 任一任务失败或被取消则不提交；github-release 在预发行时被 skip 不算失败
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: main
          fetch-depth: 0
      - name: Trigger bindings release
        env:
          NEW: ${{ inputs.version }}
        run: |
          curl \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GIT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/xllgl2017/reqrio-bindings/dispatches \
            -d '{
              "event_type":"reqrio-release",
              "client_payload":{
                "version":"'${NEW}'"
              }
            }'


