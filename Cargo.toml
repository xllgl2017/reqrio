[workspace]
resolver = "1"
members = [
    "reqrio"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
reqrio-json = { path = "json", version = "0.1.13" }
reqtls = { path = "reqtls", version = "=0.4.0-alpha3" }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
#panic = "abort"
incremental = false